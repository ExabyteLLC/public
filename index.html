<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExabyteLLC Public Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    /* Global */
    body {
      font-family: 'Roboto Mono', monospace;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 0;
    }

    /* Header */
    header {
      background: #161b22;
      padding: 2rem;
      text-align: center;
      border-bottom: 2px solid #30363d;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 1px;
      color: #58a6ff;
    }

    /* Main container */
    main {
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .links-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
    }

    /* Categories */
    .category {
      margin-bottom: 2rem;
    }

    .category h2 {
      font-size: 1.2rem;
      color: #79c0ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.3rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    /* Links */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin: 0.5rem 0;
      padding: 0.6rem 1rem;
      border: 1px solid #30363d;
      border-radius: 4px;
      transition: 0.2s;
      background: #0d1117;
    }

    li:hover {
      background: #21262d;
      border-color: #58a6ff;
    }

    a {
      text-decoration: none;
      color: #c9d1d9;
      font-weight: 500;
      display: block;
    }

    a:hover {
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <header>
    <h1>ExabyteLLC Public Links</h1>
  </header>

  <main>
    <div class="links-container" id="links"></div>
  </main>

  <script>
    const linksData = {
      "Utilities": {
        internet: "Internet Checker",
      },
    };

    const container = document.getElementById("links");

    for (const category in linksData) {
      const catDiv = document.createElement("div");
      catDiv.className = "category";

      const catTitle = document.createElement("h2");
      catTitle.textContent = category;
      catDiv.appendChild(catTitle);

      const ul = document.createElement("ul");

      for (const key in linksData[category]) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "#"; // replace with actual links
        a.textContent = linksData[category][key];
        li.appendChild(a);
        ul.appendChild(li);
      }

      catDiv.appendChild(ul);
      container.appendChild(catDiv);
    }
  </script>
</body>
</html>
