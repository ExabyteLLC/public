<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExabyteLLC Public Links</title>
    <link
      rel="icon"
      href="https://exabytellc.com/_assets/media/logo-footer.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Roboto Mono", monospace;
        background: #0d1117;
        color: #c9d1d9;
        margin: 0;
        padding: 0;
      }

      header {
        background: #161b22;
        padding: 2rem;
        text-align: center;
        border-bottom: 2px solid #30363d;
      }

      header h1 {
        margin: 0;
        font-size: 2.2rem;
        letter-spacing: 1px;
        color: #58a6ff;
      }

      main {
        display: flex;
        justify-content: center;
        padding: 2rem;
      }

      .links-container {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 2rem;
        width: 100%;
        max-width: 500px;
      }

      .category {
        margin-bottom: 2rem;
      }

      .category h2 {
        font-size: 1.2rem;
        color: #79c0ff;
        border-bottom: 1px solid #30363d;
        padding-bottom: 0.3rem;
        margin-bottom: 1rem;
        text-transform: uppercase;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        margin: 0.5rem 0;
        border: 1px solid #30363d;
        border-radius: 4px;
        transition: 0.2s;
        background: #0d1117;
      }

      li:hover {
        background: #21262d;
        border-color: #58a6ff;
      }

      a {
        padding: 0.6rem 1rem;
        text-decoration: none;
        color: #c9d1d9;
        font-weight: 500;
        display: block;
      }

      a:hover {
        color: #58a6ff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ExabyteLLC Public Links</h1>
    </header>

    <main>
      <div class="links-container" id="links"></div>
    </main>

    <script>
      // Category and item factory functions
      function cat(link, name, items) {
        return { link, name, items };
      }
      function item(link, name) {
        return { link, name };
      }

      // Data
      const linksData = [
        cat("utils", "Utilities", [item("internet", "Internet Checker")]),
        cat("canvas", "Canvas", [item("effects", "Canvas Effects")]),
        cat("games", "Games", [
          item("infinity-puzzle", "Infinity Puzzle"),
          item("gradient-puzzle", "Gradient Puzzle"),
        ]),
      ];

      // Render
      const container = document.getElementById("links");
      for (const category of linksData) {
        const catDiv = document.createElement("div");
        catDiv.className = "category";

        const catTitle = document.createElement("h2");
        catTitle.textContent = category.name;
        catDiv.appendChild(catTitle);

        const ul = document.createElement("ul");

        for (const linkItem of category.items) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = `./${category.link}/${linkItem.link}`;
          a.textContent = linkItem.name;
          li.appendChild(a);
          ul.appendChild(li);
        }

        catDiv.appendChild(ul);
        container.appendChild(catDiv);
      }
    </script>
  </body>
</html>
