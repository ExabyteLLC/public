<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Effects</title>

    <!-- bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- models -->
    <script src="./models/Loader.js"></script>
    <script src="./models/CanvasEffect.js"></script>
    <script src="./models/AudioCtx.js"></script>
    <!-- effects -->
    <script src="./effects/MatrixRainEffect.js"></script>
    <script src="./effects/ParticleFlowEffect.js"></script>
    <script src="./effects/FlowFieldEffect.js"></script>
    <script src="./effects/BarVisualizerEffect.js"></script>
    <script src="./effects/SpeechVisualizerEffect.js"></script>

    <!-- html js -->
    <script src="./script/append.js"></script>
    <script src="./script/dataTypes.js" defer></script>
    <script src="./script/data.js" defer></script>
    <script src="./script/index.js" defer></script>

    <style>
      html {
        font-size: 12px;
      }
    </style>
  </head>

  <body class="position-fixed w-100 h-100">
    <div class="position-relative w-100 h-100">
      <canvas class="w-100 h-100 object-fit-contain" id="canvas"></canvas>

      <div class="position-absolute top-0 end-0 p-1">
        <div class="d-flex justify-content-end align-items-center mb-1">
          <button class="btn btn-link p-0" id="fullscreen">Hide/Show</button>
        </div>
        <div class="border rounded-2 bg-white overflow-hidden" id="controls">
          <table class="table align-middle m-0">
            <tbody>
              <tr>
                <th class="py-1">
                  <label class="w-100">Effect</label>
                  <select
                    class="form-select form-select-sm"
                    id="effectsList"
                  ></select>
                </th>
              </tr>
            </tbody>
            <tbody id="optionsList"></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
