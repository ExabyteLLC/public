<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>effects</title>

  <!-- bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- models -->
  <script src="./models/CanvasEffect.js"></script>
  <script src="./models/AudioCtx.js"></script>
  <!-- effects -->
  <script src="./effects/MatrixRainEffect.js"></script>
  <script src="./effects/FlowFieldEffect.js"></script>
  <script src="./effects/BarVisualizerEffect.js"></script>
  <script src="./effects/SpeechVisualizerEffect.js"></script>

  <!-- html js -->
  <script src="./script/append.js"></script>
  <script src="./script/data.js" defer></script>
  <script src="./script/index.js" defer></script>
</head>

<body class="position-fixed w-100 h-100">
  <div class="position-relative w-100 h-100">
    <canvas class="w-100 h-100 object-fit-contain" id="canvas"></canvas>

    <div class="position-absolute top-0 start-0">
      <button class="btn btn-link" id="fullscreen">
        Fullscreen
      </button>
    </div>

    <div class="position-absolute top-0 end-0 p-1">
      <div class="list-group" id="effectsList"></div>
    </div>

    <div class="position-absolute bottom-0 end-0 p-1">
      <table class="table border rounded-2 align-middle" id="optionsList">

      </table>
    </div>
  </div>

  <div class="d-none">
    <button type="button" class="list-group-item list-group-item-action btn-sm" id="effectsItem">
    </button>

    <table>
      <tbody id="optionsItem"></tbody>

      <tr id="optionGroup">
        <td label class="py-1 px-1"></td>
        <td class="py-1">
          <label input class="w-100"></label>
        </td>
      </tr>
    </table>
    <input class="form-control form-control-sm" id="optionInput"></input>
    <select class="form-select form-select-sm" id="optionSelect"></select>
    <input type="range" class="form-range form-range-sm" id="optionRange"></input>
    <input type="checkbox" class="form-check-input" id="optionCheckbox"></input>
  </div>
</body>
</html>
