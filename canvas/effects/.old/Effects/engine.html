<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>effects</title>

    <!-- bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- models -->
    <script src="./models/CanvasEngine.js"></script>
  </head>

  <body class="position-fixed w-100 h-100">
    <div class="position-relative w-100 h-100">
      <canvas class="w-100 h-100 object-fit-contain" id="canvas"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const engine = new CanvasEngine(canvas, {
        sizeAuto: true,
        fpsInfinite: false,
        fpsLimit: 1,
      });
      engine.start();

      // engine.onRender = ({ ctx, fps }) => {
      //   console.log(ctx, fps);
      // };
      var t = 0;

      const obj = engine.createObject({
        onRender: (data) => {
          console.log(t, data);
          if (t > 4) {
            obj.delete();
          }
          t += 1;
        },
      });

      class Particle extends CanvasObject {}
    </script>
  </body>
</html>
